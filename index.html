<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efsane Yılan Oyunu - Online Ücretsiz Oyna</title>
    <meta name="description" content="Tarayıcı üzerinden oynanabilen en iyi yılan oyunu. Skorunu yap ve Google'da birinci ol!">
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { border: 10px solid #333; box-shadow: 0 0 30px rgba(0,255,0,0.2); background-color: #000; }
        #ui { margin-bottom: 15px; text-align: center; }
        h1 { margin: 0; color: #4CAF50; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Online Yılan Oyunu</h1>
        <p>Skor: <span id="scoreVal">0</span></p>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("scoreVal");

        let box = 20, score = 0, snake = [{x: 9 * box, y: 10 * box}], d;
        let food = { x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box };

        document.addEventListener("keydown", (e) => {
            if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(e.keyCode == 38 && d != "DOWN") d = "UP";
            else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(e.keyCode == 40 && d != "UP") d = "DOWN";
        });

        function draw() {
            ctx.fillStyle = "black"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<snake.length; i++){
                ctx.fillStyle = (i==0) ? "#4CAF50" : "#81C784";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }
            ctx.fillStyle = "red"; ctx.fillRect(food.x, food.y, box, box);

            let sX = snake[0].x, sY = snake[0].y;
            if(d == "LEFT") sX -= box; if(d == "UP") sY -= box;
            if(d == "RIGHT") sX += box; if(d == "DOWN") sY += box;

            if(sX == food.x && sY == food.y){
                score++; scoreElement.innerText = score;
                food = { x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box };
            } else { snake.pop(); }

            let nH = {x: sX, y: sY};
            if(sX<0 || sX>=canvas.width || sY<0 || sY>=canvas.height || snake.some(s => s.x==nH.x && s.y==nH.y)){
                alert("Oyun Bitti! Skor: " + score); location.reload();
            }
            snake.unshift(nH);
        }
        setInterval(draw, 120);
    </script>
</body>
</html>
